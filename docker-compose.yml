version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Nairobi
      # Set N8N_SECURE_COOKIE to false if accessing over http without local SSL
      - N8N_SECURE_COOKIE=false
    volumes:
      # Persistent storage for credentials, execution history, and SQLite DB
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: n8n_data
